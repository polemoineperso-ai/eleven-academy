    if (e.target.closest?.("#ed-box")) {
      e.preventDefault();
      const data = e.clipboardData, rich = data.getData("text/html");
      const html = rich ? cleanRich(rich) : data.getData("text/plain").split(/\r?\n/).filter((l) => l.trim()).map((l) => `<p>${esc(l)}</p>`).join("");
      if (S.edit) S.edit.hist.push(edBox().innerHTML);
      document.execCommand("insertHTML", false, html);
      edTouched();
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "ed-box") {
      if (S.edit && (!S.edit.lastHist || Date.now() - S.edit.lastHist > 1500)) { S.edit.hist.push(S.edit.html); S.edit.lastHist = Date.now(); }
      edTouched();
    }
    if (e.target.dataset?.cas) { const cur = examNow(); if (cur) { cur.cas[e.target.dataset.cas] = e.target.value; save(); } return; }
    if (e.target.id === "card-q") { S.cardQ.q = e.target.value; document.getElementById("card-out").innerHTML = typo(cardOut()); return; }
    if (e.target.id !== "rev-q") return;
    S.rev.q = e.target.value;
    document.getElementById("rev-chips").hidden = normS(S.rev.q).trim().length < 2;
    document.getElementById("rev-out").innerHTML = typo(normS(S.rev.q).trim().length >= 2 ? revResults() : revDefault());
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "arb-form") return;
    e.preventDefault();
    const box = document.getElementById("arb-q"), v = box.value;
    box.value = ""; arbAsk(v);
  });
  document.addEventListener("submit", async (e) => {
    if (e.target.id === "ask-name") {
      e.preventDefault();
      const v = document.getElementById("s-name").value.trim(); if (!v) return;
      S.progress.settings.name = v; S.name = v; save(); render(); return;
    }
    if (e.target.id === "login") {
      e.preventDefault();
      const L = S.login; L.err = "";
      if (L.step !== "code") {
        L.email = document.getElementById("l-email").value.trim(); L.name = document.getElementById("l-name").value.trim();
        if (!/^\S+@\S+\.\S+$/.test(L.email)) { L.err = "Indique une adresse e-mail valide, par exemple prenom@exemple.fr."; render(); document.getElementById("l-email")?.focus(); return; }
        const r = await S.sb.auth.signInWithOtp({ email: L.email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
        if (r.error) {
          const code = r.error.code || "";
          L.err = code === "over_email_send_rate_limit" || r.error.status === 429 ? "Trop de liens envoyés pour l'instant : le service limite les envois par heure. Réessaie dans une heure."
            : code === "email_address_not_authorized" ? "Cette adresse n'est pas autorisée pour le moment. Demande à l'administrateur de l'appli de l'ajouter."
            : code === "signup_disabled" || code === "otp_disabled" ? "Les nouvelles inscriptions sont fermées, et cette adresse n'a pas de compte. Vérifie l'orthographe, ou demande à l'administrateur."
            : "Le lien n'a pas pu être envoyé. Vérifie ta connexion et réessaie.";
          render(); return;
        }
        lsSet("ea-pending-name", L.name);
        L.step = "code"; render(); document.getElementById("l-code")?.focus(); return;
      }
      const token = document.getElementById("l-code").value.replace(/\s/g, "");
      const r = await S.sb.auth.verifyOtp({ email: L.email, token, type: "email" });
      if (r.error || !r.data || !r.data.user) { L.err = "Code incorrect ou expiré. Vérifie le dernier e-mail reçu, ou demande un nouveau code."; render(); document.getElementById("l-code")?.focus(); return; }
      await signedIn(r.data.user, L.name);
      return;
    }
    if (e.target.id !== "report") return;
    e.preventDefault();
    const msg = document.getElementById("r-msg").value.trim(); const qid = document.getElementById("r-q").value;
    const err = document.getElementById("r-err");
    if (msg.length < 5) { err.hidden = false; err.textContent = "Décris l'erreur en quelques mots avant d'envoyer."; document.getElementById("r-msg").focus(); return; }
    const item = { question: qid || null, message: msg, date: new Date().toISOString(), version: S.content?.version || "" };
    if (S.sb && S.uid) {
      const r = await S.sb.from("reports").insert({ question: item.question, message: item.message, version: item.version }).catch((x) => ({ error: x }));
      if (r && r.error) { const pend = lsGet("ea-reports") || []; pend.push(item); lsSet("ea-reports", pend); toast("Envoi impossible pour l'instant : le signalement est gardé sur cet appareil."); }
      else toast("Signalement envoyé. Merci !");
    } else if (S.db && S.uid) {
      try { await S.db.doc("reports/" + S.uid).collection("items").add(item); toast("Signalement envoyé. Merci !"); }
      catch { const pend = lsGet("ea-reports") || []; pend.push(item); lsSet("ea-reports", pend); toast("Envoi impossible pour l'instant : le signalement est gardé sur cet appareil."); }
    } else { const pend = lsGet("ea-reports") || []; pend.push(item); lsSet("ea-reports", pend); toast("Signalement gardé sur cet appareil : la synchronisation n'est pas active."); }
    document.getElementById("r-msg").value = "";
  });

  /* ---------- Boot ---------- */
  const CFG = window.EA_CONFIG || {};
  async function afterAuth(hotData) {
    fetch("content/articles.json").then((r) => r.ok ? r.json() : null).then((j) => { S.arts = j; if (j && !S.welcome) linkRefs(document.getElementById("app")); }).catch(() => {});
    await Promise.all([loadContent(), loadProgress()]);
    await loadFicheEdits();
    if (hotData && hotData.session && S.content) { S.session = hotData.session; S.view = hotData.view || "home"; S.param = hotData.param ?? null; }
    else if (S.content) {
      const kept = lsGet(sessKey());
      if (kept && kept.ids && kept.date === today() && kept.i < kept.ids.length && kept.ids.every((id) => C.q(id))) { kept.picked = null; S.pending = kept; }
      else lsSet(sessKey(), null);
    }
    render();
  }
  async function signedIn(user, name) {
    S.login = null; S.uid = user.id; S.email = user.email || "";
    S.progress = null; render();
    await afterAuth({});
    if (name && !S.progress.settings.name) { S.progress.settings.name = name; S.name = name; save(); render(); }
  }
  async function start(hotData) {
    render();
    if (!window.claude && CFG.supabaseUrl && CFG.supabaseKey && window.supabase) {
      S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      const got = await S.sb.auth.getSession();
      const session = got && got.data ? got.data.session : null;
      if (!session) {
        S.login = { step: "email" }; render();
        S.sb.auth.onAuthStateChange((ev, sess) => { if (ev === "SIGNED_IN" && sess && S.login) signedIn(sess.user, S.login.name); });
        return;
      }
      S.uid = session.user.id; S.email = session.user.email || "";
      await afterAuth(hotData);
      const pendingName = lsGet("ea-pending-name"); /* the first name typed before the e-mail link reopened the app */
      if (pendingName && S.progress && !S.progress.settings.name) { S.progress.settings.name = pendingName; S.name = pendingName; save(); render(); }
      lsSet("ea-pending-name", "");
      return;
    }
    try { S.db = (await window.claude?.use?.("db")) || null; } catch { S.db = null; }
    try {
      const user = (await window.claude?.use?.("user")) || null;
      if (user) {
        S.uid = await user.id();
        try { S.owner = !!(await user.isOwner()); } catch { S.owner = false; }
        try { const me = await user.me(); S.name = me?.name || ""; } catch { S.name = ""; }
      }
    } catch { S.uid = null; }
    if (!S.db || !S.uid) S.sync = "local";
    await Promise.all([loadContent(), loadProgress()]);
    if (hotData && hotData.session && S.content) { S.session = hotData.session; S.view = hotData.view || "home"; S.param = hotData.param ?? null; }
    else if (S.content) {
      const kept = lsGet(sessKey());
      if (kept && kept.ids && kept.date === today() && kept.i < kept.ids.length && kept.ids.every((id) => C.q(id))) { kept.picked = null; S.pending = kept; }
      else lsSet(sessKey(), null);
    }
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ session: S.session, view: S.view, param: S.param }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
