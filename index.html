}
::selection { background: var(--green); color: var(--on-green); }
::placeholder { color: var(--fg-3); opacity: 1; }
* { box-sizing: border-box; scrollbar-color: var(--line-strong) transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
h1[tabindex="-1"]:focus, b[tabindex="-1"]:focus { outline: none; }
a { color: var(--green); text-underline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh; min-height: 100dvh;
  background: var(--column-veil); /* a plain colour: cheaper to paint than a gradient on a very long course */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: var(--pitch);
}
/* Full-width band. Not a huge box-shadow trimmed by clip-path: on iPhone the trim drops out while scrolling and the shadow hides the page */
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); background: var(--pitch); z-index: -1; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; }
.brand-crest { height: 44px; width: auto; flex: none; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
.brand-wm { height: 40px; width: auto; display: block; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.division-chip {
.division-chip { position: relative; }
.division-chip::after { content: ""; position: absolute; inset: -6px 0; }
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding-inline: 10px 12px;
  border-radius: 999px; background: var(--gold-soft); color: var(--gold);
  font-size: 13px; font-weight: 700; border: 0;
}
.division-chip svg { width: 16px; height: 16px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
  background: transparent; border: 1px solid var(--line); color: var(--chalk);
}
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn svg { width: 20px; height: 20px; }
.me-btn { width: 44px; height: 44px; padding: 0; border: 0; background: none; border-radius: 12px; flex: none; }
.me-btn img { width: 44px; height: 44px; border-radius: 12px; display: block; }
.me-initial { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: var(--green); color: var(--on-green); font-size: 20px; font-weight: 800; }

/* Picto tiles: the art-direction rasters, and the same tile drawn in CSS for glyphs the board does not have */
.pic { width: 44px; height: 44px; border-radius: 12px; display: block; flex: none; }
.tile {
  width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; color: var(--chalk);
  background: radial-gradient(120% 90% at 30% 15%, #1C3A26 0%, var(--tile-deep) 70%); border: 1px solid rgba(169, 224, 35, 0.55);
  box-shadow: 0 0 0 1px var(--green-soft), 0 0 12px var(--tile-glow), inset 0 0 8px var(--green-soft);
}
.tile svg { width: 26px; height: 26px; fill: currentColor; }
.tile .acc { fill: var(--green); }
.tile .deep { fill: var(--tile-deep); }
.tile.sm { width: 32px; height: 32px; border-radius: 9px; }
.tile.sm svg { width: 18px; height: 18px; }

/* Shared type */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-screen { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.h-sec { font-size: 18px; font-weight: 700; line-height: 1.3; }
.muted { color: var(--fg-2); }
.small { font-size: 14px; }
.tiny { font-size: 13px; color: var(--fg-3); }
.stack { display: flex; flex-direction: column; }
.screen { display: flex; flex-direction: column; gap: 28px; padding-top: 8px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link-btn { background: none; border: 0; color: var(--green); font-weight: 600; font-size: 14px; padding: 10px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.link-btn svg { width: 18px; height: 18px; flex: none; }
.link-btn:hover { text-decoration: underline; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 22px; border-radius: var(--r-s); border: 0;
  font-weight: 700; font-size: 16px; transition: background-color 160ms ease, transform 120ms ease;
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--green); color: var(--on-green); }
.btn-primary:hover { background: var(--green-press); }
.btn-ghost { background: transparent; color: var(--chalk); border: 1px solid var(--line-strong); }
.btn-ghost:hover { background: var(--turf); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Home: match of the day */
.greet { display: flex; flex-direction: column; gap: 4px; }
.greet .h-screen { font-size: 24px; }

  color: var(--chalk); padding: 22px 20px 20px; border: 1px solid rgba(169, 224, 35, 0.35);
  display: flex; flex-direction: column; gap: 14px;
}
.match-title { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: -0.01em; line-height: 1.05; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
.match-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; font-weight: 600; color: var(--chalk); }
.match-meta svg { color: var(--green); }
.match-meta span { display: inline-flex; align-items: center; gap: 6px; }
.match-meta svg { width: 16px; height: 16px; }
.match .btn { background: var(--green); color: var(--on-green); }
.match .btn:hover { background: var(--green-press); }
.match-done { font-size: 15px; font-weight: 600; }

.stats {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  border-block: 1px solid var(--line);
}
.stat { padding: 14px 4px; display: flex; flex-direction: column; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 14px; }
.stat-val { font-size: 26px; font-weight: 800; font-style: italic; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-lab { font-size: 13px; color: var(--fg-2); font-weight: 500; }

.ladder { display: flex; flex-direction: column; gap: 10px; }
.ladder-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ladder-name { font-weight: 700; color: var(--gold); display: inline-flex; gap: 6px; align-items: center; }
.ladder-name svg { width: 18px; height: 18px; }
.bar { height: 8px; border-radius: 999px; background: var(--turf-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--green); transform-origin: left; }
.bar.gold > i { background: var(--gold); }

.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 14px;
  padding: 14px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0;
  text-align: left; width: 100%; color: inherit; min-height: 64px;
}
.row:first-child { border-top: 1px solid var(--line); }
button.row:hover .row-title { color: var(--green); }
.row-title { font-weight: 700; font-size: 16px; }
.row-sub { font-size: 13px; color: var(--fg-2); }
.row-side { display: flex; align-items: center; gap: 10px; color: var(--fg-2); font-size: 14px; font-weight: 600; }
.row-side svg { width: 18px; height: 18px; }
.row .bar { grid-column: 1 / -1; height: 6px; }
.row.has-pic { grid-template-columns: 44px minmax(0, 1fr) auto; }
.row.has-pic .bar { grid-column: 2 / -1; }
.sec-title { display: flex; align-items: center; gap: 12px; }
.sec-head:has(.sec-title) { align-items: center; }

.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }

/* Chapter path: Cours -> Fiche -> Questions */
.path { display: flex; flex-direction: column; }
.step {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 4px 14px;
  padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none;
  text-align: left; width: 100%; color: inherit; min-height: 68px;
}
.step:first-child { border-top: 1px solid var(--line); }
button.step:hover .row-title { color: var(--green); }
.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; border: 2px solid var(--line-strong); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.step-n svg { width: 18px; height: 18px; }
.step.is-done .step-n { background: var(--green); border-color: var(--green); color: var(--on-green); }
.step.is-next .step-n { border-color: var(--green); color: var(--green); }
.step.is-off { color: var(--fg-3); }
.step.is-off .row-sub { color: var(--fg-3); }

/* Lesson (cours) */
.lesson { display: flex; flex-direction: column; gap: 16px; }
.lesson-sec { gap: 14px; scroll-margin-top: 84px; }
.lesson-h2 { font-size: 20px; font-weight: 800; line-height: 1.3; text-wrap: balance; margin: 0; }
.lesson-code { color: var(--ink-2); font-variant-numeric: tabular-nums; margin-right: 6px; }
.sheet.dark .lesson-code { color: var(--green); }
.lesson-ref { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: -6px 0 0; }
.sheet.dark .lesson-ref { color: var(--fg-2); }
.lesson-h3 { font-size: 17px; font-weight: 700; line-height: 1.35; margin: 10px 0 0; }
.lesson-p, .lesson-list li { font-size: 16px; line-height: 1.65; max-width: 65ch; margin: 0; }
.lesson-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.lesson-list li::marker { color: var(--ink-2); }
.sheet.dark .lesson-list li::marker { color: var(--green); }
.callout { margin-inline: -18px; padding: 14px 18px 15px; display: flex; flex-direction: column; gap: 6px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; max-width: 65ch; }
.callout.cas { background: rgba(18, 22, 18, 0.05); }
.callout.warn { background: rgba(245, 184, 46, 0.32); }
.callout.warn .callout-lab { color: #6B4A00; }
.callout.memo { background: rgba(169, 224, 35, 0.22); }
.sheet.dark .callout.cas { background: rgba(255, 255, 255, 0.06); }
.sheet.dark .callout.warn { background: rgba(245, 184, 46, 0.2); }
.sheet.dark .callout.warn .callout-lab { color: var(--gold); }
.sheet.dark .callout.memo { background: rgba(169, 224, 35, 0.2); }
.callout .callout-lab { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; }
.callout-lab svg { width: 18px; height: 18px; flex: none; }
.callout .callout-sub { font-size: 13.5px; font-weight: 800; margin-top: 4px; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.lesson-table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; }
.lesson-table th, .lesson-table td { text-align: left; vertical-align: top; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--paper-line); }
.lesson-table th { font-size: 13px; font-weight: 800; color: var(--ink-2); }
.lesson-table td:first-child { font-weight: 700; }
.lesson-table td.num, .lesson-table th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet.dark .lesson-table th, .sheet.dark .lesson-table td { border-color: var(--line); }
.sheet.dark .lesson-table th { color: var(--fg-2); }
.tgroups { display: flex; flex-direction: column; }
.tgroup { padding: 12px 0; border-bottom: 1px solid var(--paper-line); }
.tgroup:first-child { padding-top: 2px; }
.sheet.dark .tgroup { border-color: var(--line); }
.tgroup-h { font-weight: 800; font-size: 15.5px; margin: 0 0 6px; }
.tgroup dl { display: grid; grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14.5px; line-height: 1.5; }
.tgroup dt { color: var(--ink-2); font-weight: 600; }
.sheet.dark .tgroup dt { color: var(--fg-2); }
.tgroup dd { margin: 0; }
.lesson-end { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.lesson-lead { font-size: 16px; font-weight: 700; line-height: 1.5; margin: 4px 0 0; max-width: 65ch; }
.rev-search { padding-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.rev-search:focus-within, .rev-search:has(input:not(:placeholder-shown)) { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 10; background: var(--pitch); margin-inline: -16px; padding-inline: 16px; }
.chips[hidden] { display: none; }
.rev-search label { font-size: 14px; font-weight: 700; }
.rev-search input { width: 100%; min-height: 50px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf); color: var(--chalk); font: inherit; font-size: 16px; }
.rev-search input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; color: var(--fg-2); font: inherit; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.rev-count { font-size: 14px; color: var(--fg-2); margin: 0; }
.row mark, .row-sub mark { background: var(--green); color: var(--on-green); border-radius: 3px; padding: 0 2px; }
.rev-kind { font-weight: 700; color: var(--chalk); }
a.row { text-decoration: none; }
a.row:hover .row-title { color: var(--green); }

/* Paper sheet (fiche, article) */
.sheet {
  background: var(--paper); color: var(--ink); border-radius: var(--r-m);
  padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;
}
.sheet.dark { background: var(--turf); color: var(--chalk); }
.sheet.dark .sheet-src, .sheet.dark .sheet-list li::before { color: var(--fg-2); }
.sheet-title { font-size: 19px; font-weight: 800; }
.sheet-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.sheet-list li { position: relative; padding-left: 18px; font-size: 15.5px; line-height: 1.6; }
.sheet-list li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--green-press); }
.sheet-src { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--paper-line); padding-top: 10px; }
.sheet.dark .sheet-src { border-color: var(--line); }

/* Article references */
.ref { display: inline; padding: 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; text-decoration: underline dotted var(--green-press) 2px; text-underline-offset: 3px; cursor: pointer; }
.ref:hover { text-decoration-style: solid; }
.art-dlg { width: min(100%, 620px); max-width: 100%; max-height: 82vh; max-height: 82dvh; margin: auto auto 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: var(--r-m) var(--r-m) 0 0; background: var(--turf); color: var(--chalk); }
.art-dlg[open] { display: flex; flex-direction: column; gap: 14px; }
.art-dlg::backdrop { background: rgba(5, 8, 6, 0.72); }
.art-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.art-title { margin: 0; font-size: 20px; font-weight: 800; }
.art-dlg:focus, #arb-t:focus { outline: none; }
.arb-log { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.arb-intro { margin: 0; font-size: 16px; line-height: 1.5; color: var(--fg-2); }
.arb-sugg { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.arb-sugg button { min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: none; color: var(--chalk); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
.arb-sugg button:hover { background: var(--turf-2); }
.arb-me { align-self: flex-end; max-width: 85%; margin: 0; padding: 10px 14px; border-radius: var(--r-s); background: var(--turf-2); font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.arb-ans p { margin: 0 0 10px; font-size: 16px; line-height: 1.6; max-width: 65ch; }
.arb-ans p:last-child { margin-bottom: 0; }
.arb-src { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: var(--fg-3); }
.arb-wait { margin: 0; font-size: 15px; color: var(--fg-2); }
.arb-err { margin: 0; font-size: 15px; line-height: 1.45; color: var(--chalk); }
.arb-form { display: flex; flex-direction: column; gap: 8px; }
.arb-form label { font-size: 14px; font-weight: 600; }
.arb-form textarea { width: 100%; min-height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--pitch); color: var(--chalk); font: inherit; font-size: 16px; line-height: 1.4; resize: none; }
.arb-foot { margin: 0; font-size: 13px; line-height: 1.45; color: var(--fg-3); }
.art-text p { margin: 0 0 10px; font-size: 16px; line-height: 1.6; max-width: 65ch; }
@media (min-width: 620px) { .art-dlg { margin: auto; border-radius: var(--r-m); } }

/* Guided tour */
.tour { min-height: calc(100vh - 100px); min-height: calc(100dvh - 100px); display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.tour-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tour-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px; padding-block: 16px; }
.tour-body .pic, .tour-body .tile { width: 84px; height: 84px; border-radius: 20px; }
.tour-body .tile svg { width: 48px; height: 48px; }
.tour-title { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.tour-text { margin: 0; font-size: 17px; line-height: 1.6; max-width: 65ch; }
.tour-actions { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding-bottom: 12px; }

/* Licence */
.licence { display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: var(--r-m); border: 1px solid var(--tile-rim); background: linear-gradient(160deg, rgba(169, 224, 35, 0.16), rgba(169, 224, 35, 0) 55%), var(--turf); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4); }
.lic-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
.lic-crest { width: 58px; height: auto; flex: none; display: block; }
.lic-name { margin: 0; font-size: 26px; font-weight: 900; font-style: italic; line-height: 1.15; overflow-wrap: anywhere; }
.lic-div { margin: 2px 0 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--gold); }
.lic-div svg { width: 18px; height: 18px; flex: none; }
.lic-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding-block: 12px; border-block: 1px solid var(--line); }
.lic-stats div { display: flex; flex-direction: column-reverse; gap: 2px; min-width: 0; }
.lic-stats div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.lic-stats dd { margin: 0; font-size: 22px; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; line-height: 1.1; }
.lic-stats dt { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.lic-foot { margin: 0; font-size: 14px; color: var(--fg-2); }

/* Match officiel */
.exam-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--pitch); padding-block: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.exam-time { font-size: 16px; font-weight: 800; }
.exam-time.is-low { color: var(--red); }
.exam-fix .seg { display: grid; grid-template-columns: repeat(3, 1fr); }
.exam-fix .seg button { height: 44px; padding-inline: 6px; }
.exam-yours { white-space: pre-wrap; overflow-wrap: anywhere; }
.exam-q { display: flex; flex-direction: column; gap: 12px; padding-block: 8px; }
.exam-case { margin: 0; font-size: 16px; line-height: 1.6; max-width: 65ch; }
.exam-text { width: 100%; padding: 12px 14px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf); color: var(--chalk); font: inherit; line-height: 1.5; resize: vertical; }
.exam-text:focus { outline: 2px solid var(--green); outline-offset: 1px; }
.opt.is-picked { border-color: var(--green); background: var(--green-soft); }
.opt.is-picked .opt-letter { background: var(--green); color: var(--on-green); }
.exam-score { display: flex; flex-direction: column; gap: 10px; }
.exam-fix { display: flex; flex-direction: column; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); }
.exam-fq { margin: 0; font-weight: 700; line-height: 1.45; }
.exam-corr { margin: 0; line-height: 1.55; }
.exam-mark { display: inline-flex; vertical-align: -3px; margin-right: 6px; }
.exam-mark svg { width: 18px; height: 18px; }
.exam-mark.ok { color: var(--green); }
.exam-mark.ko { color: var(--red); }

/* Cards */
.flash { width: 100%; min-height: 46vh; border: 0; text-align: left; color: var(--ink); font: inherit; gap: 14px; }
.flash-front { cursor: pointer; justify-content: center; align-items: center; text-align: center; position: relative; padding-block: 40px; }
.flash-pic { display: block; }
.flash-recto { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.flash-title { font-size: 21px; font-weight: 800; line-height: 1.25; margin: 0; text-wrap: balance; }
.flash-text { font-size: 17px; line-height: 1.6; margin: 0; max-width: 65ch; }
.flash-foot { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0; }
.sheet.dark .flash-foot { color: var(--fg-2); }
.sheet.dark.flash.is-back .flash-foot { border-color: var(--line); }
.sheet.dark.flash { color: var(--chalk); }
.cards-count { font-weight: 700; color: var(--chalk); }
.flash-front .flash-foot { position: absolute; left: 0; right: 0; bottom: 18px; }
.flash.is-back .flash-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--paper-line); }
.flash-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 15; }
.flash-actions .btn-ghost { background: var(--pitch); }
.flash-turn { animation: flash-turn 260ms cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes flash-turn { from { transform: perspective(900px) rotateY(-70deg); opacity: 0.4; } to { transform: none; opacity: 1; } }

/* Fiche text: same rules when reading and when editing */
.rich > * + * { margin-top: 12px; }
.rich > :first-child { margin-top: 0; }
.rich h3 { font-size: 19px; font-weight: 800; line-height: 1.3; margin: 26px 0 0; text-wrap: balance; }
.rich h4 { font-size: 16px; font-weight: 700; line-height: 1.35; margin: 18px 0 0; }
.rich h3 + *, .rich h4 + * { margin-top: 8px; }
.rich p, .rich li { font-size: 15.5px; line-height: 1.6; max-width: 65ch; margin: 0; }
.rich p + p, .rich > ul + p, .rich > ol + p, .rich > table + p, .rich > blockquote + p, .rich > div + p { margin-top: 12px; }
.rich ul, .rich ol { padding-left: 22px; margin-bottom: 0; }
.rich > ul, .rich > ol { margin-top: 12px; }
.rich > :first-child:is(ul, ol) { margin-top: 0; }
.rich li + li { margin-top: 8px; }
.rich li > ul, .rich li > ol { margin-top: 8px; }
.rich li > ul { list-style: circle; }
.rich li::marker { color: var(--green-press); font-weight: 700; }
.rich blockquote { margin: 12px 0 0 22px; padding: 0; border: 0; }
.rich strong { font-weight: 700; }
.rich mark { background: var(--green); color: var(--on-green); border-radius: 3px; padding: 0 0.2em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.rich h2 { font-size: 20px; font-weight: 800; line-height: 1.3; margin: 0; text-wrap: balance; }
.lesson-sec .rich h3 { font-size: 17px; font-weight: 700; line-height: 1.35; margin-top: 20px; }
.lesson-sec .rich h4 { font-size: 15.5px; margin-top: 14px; }
.lesson-sec .rich p, .lesson-sec .rich li { font-size: 16px; line-height: 1.65; }
.rich .callout { margin-top: 14px; margin-bottom: 14px; }
.rich .callout p { font-size: 15.5px; line-height: 1.6; }
.rich .callout p + p { margin-top: 0; }
.rich table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; margin-top: 12px; }
.rich table th, .rich table td { text-align: left; vertical-align: top; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--paper-line); }
.ed-box table { display: block; overflow-x: auto; }
.sheet.dark .rich table th, .sheet.dark .rich table td { border-color: var(--line); }
.sec-edit { align-self: flex-start; gap: 6px; }

/* Fiche editor */
.ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--pitch); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.ed-tool { min-height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf); color: var(--chalk); font-size: 14px; font-weight: 600; transition: background-color 140ms ease, color 140ms ease; }
.ed-tool:hover { background: var(--line); }
.ed-tool[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.ed-tool svg { width: 20px; height: 20px; }
.ed-tool mark { background: var(--green); color: var(--on-green); border-radius: 3px; padding: 1px 5px; }
.ed-tool[aria-pressed="true"] mark { background: transparent; }
.ed-box { min-height: 46vh; caret-color: var(--green-press); display: block; }
.ed-box:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.ed-box::selection, .ed-box *::selection { background: rgba(150, 203, 26, 0.45); }
.ed-note { margin: 0; font-size: 14px; color: var(--fg-2); }
.ed-err { margin: 0; font-size: 14px; color: var(--red); }
.ed-confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-s); background: var(--red-soft); }
.ed-confirm p { margin: 0; font-size: 15px; font-weight: 600; }

/* Quiz */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--pitch); padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.quiz-top-row { display: flex; align-items: center; gap: 12px; }
.quiz-count { font-weight: 800; font-style: italic; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.quiz-chap { font-size: 13px; color: var(--fg-2); margin-left: auto; text-align: right; min-width: 0; text-wrap: balance; }
.q-text { font-size: 19px; font-weight: 600; line-height: 1.45; max-width: 65ch; }
.q-level { font-size: 13px; color: var(--fg-3); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; border: 0; }
.opt {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) 22px; align-items: center; gap: 12px;
  width: 100%; min-height: 56px; padding: 10px 14px 10px 10px; text-align: left;
  border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf);
  color: var(--chalk); font-size: 15.5px; line-height: 1.4; font-weight: 500;
  transition: border-color 140ms ease, background-color 140ms ease;
}
@media (hover: hover) { .opt:hover:not([disabled]) { border-color: var(--green); } }
.opt-letter {
  width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
  background: var(--turf-2); font-weight: 800; font-size: 15px;
}
.opt-mark svg { width: 22px; height: 22px; display: block; }
.opt[disabled] { cursor: default; }
.opt.is-right { border-color: var(--green); background: var(--green-soft); }
.opt.is-right .opt-letter { background: var(--green); color: var(--on-green); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.opt.is-wrong .opt-letter { background: var(--red); color: var(--pitch); }
.opt.is-dim { opacity: 0.72; }

/* Revue VAR: the signature panel */
.var {
  display: flex; flex-direction: column; gap: 0;
  animation: var-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes var-in { from { clip-path: inset(0 0 100% 0 round 16px); transform: translateY(8px); } to { clip-path: inset(0 0 0 0 round 16px); transform: none; } }
.var-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-s); }
.var-head.ok { background: var(--green); color: var(--on-green); }
.var-head.ko { background: var(--red); color: var(--pitch); }
.var-head .pic { width: 40px; height: 40px; border-radius: 10px; }
.var-verdict { display: flex; flex-direction: column; line-height: 1.2; }
.var-verdict b { font-size: 19px; font-weight: 900; font-style: italic; }
.var-verdict span { font-size: 13.5px; font-weight: 600; }
.var-body { padding: 16px 0 0; display: flex; flex-direction: column; gap: 14px; }
.var-expl { font-size: 15.5px; line-height: 1.6; max-width: 65ch; }
.rule { background: var(--paper); color: var(--ink); border-radius: var(--r-s); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.rule.dark { background: var(--turf-2); color: var(--chalk); }
.rule-ref { font-weight: 800; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.rule-ref span { font-weight: 600; color: var(--ink-2); font-size: 13px; }
.rule.dark .rule-ref span, .rule.dark .rule-date { color: var(--fg-2); }
.rule-text { font-size: 15px; line-height: 1.6; margin: 0; max-width: 65ch; }
.rule-date { font-size: 12.5px; color: var(--ink-2); }
.before { border-top: 1px solid var(--line-strong); padding: 12px 0 0; display: flex; flex-direction: column; gap: 4px; }
.before b { color: var(--chalk); font-size: 13.5px; }
.before p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--fg-2); }
.var-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.origin { font-size: 12.5px; color: var(--fg-3); }
.quiz-next { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 15; }

/* Result */

}
.score-big { font-size: 76px; font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.score-big small { font-size: 36px; color: var(--fg-2); }
.gains { display: flex; flex-wrap: wrap; gap: 8px; }
.gain { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--turf); font-weight: 700; font-size: 14px; }
.gain svg { width: 16px; height: 16px; }
.trophy-new { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-m); background: var(--gold-soft); color: var(--gold); }
.trophy-new .pic { width: 52px; height: 52px; }
.trophy-new b { display: block; font-size: 17px; }
.trophy-new span { color: var(--chalk); font-size: 14px; }
.pop { animation: pop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: none; opacity: 1; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sheet-list b { font-weight: 700; }
.home-side { display: flex; flex-direction: column; gap: 28px; }
.confirm { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 16; background: var(--turf-2); border: 1px solid var(--line-strong); border-radius: var(--r-m); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.resume { display: flex; flex-direction: column; gap: 10px; }

/* Division ladder */
.divs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.divs li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--fg-3); }
.divs li .pic { width: 30px; height: 30px; border-radius: 8px; }
.divs li.done .pic { opacity: 0.55; filter: saturate(0.35); }
.divs li.done { color: var(--fg-2); }
.divs li.cur { color: var(--gold); font-weight: 700; }
.divs li .num { font-variant-numeric: tabular-nums; text-align: right; }
.divs-togo { font-size: 13px; color: var(--fg-2); padding-top: 8px; margin: 0; }

/* Trophies */
.cabinet { display: flex; flex-direction: column; }
.trophy { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.trophy:first-child { border-top: 1px solid var(--line); }
.trophy-mark { width: 44px; height: 44px; display: block; transition: opacity 160ms ease, filter 160ms ease; }
.trophy:not(.won) .trophy-mark { opacity: 0.5; filter: saturate(0.35); }
.trophy b { display: block; font-size: 15px; line-height: 1.3; }
.trophy .row-sub { display: block; }
.trophy-val { font-size: 13px; font-weight: 700; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trophy.won .trophy-val { color: var(--gold); }
.trophy .bar { grid-column: 2 / -1; height: 5px; }

/* Settings */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); min-height: 60px; }
.setting label { display: flex; flex-direction: column; gap: 2px; }
.setting label b { font-weight: 600; }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--turf-2); border: 1px solid var(--line-strong); position: relative; flex: none; cursor: pointer; transition: background-color 160ms ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg-2); transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), background-color 160ms ease; }
.switch:checked { background: var(--green); border-color: var(--green); }
.switch:checked::after { transform: translateX(20px); background: var(--on-green); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-width: 44px; height: 36px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--pitch); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field input, .field textarea, .field select { width: 100%; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf); padding: 12px; min-height: 48px; }
.field textarea { min-height: 110px; resize: vertical; }
.note { font-size: 14px; padding: 12px 14px; border-radius: var(--r-s); background: var(--turf); color: var(--fg-2); }
.note.ok { background: var(--green-soft); color: var(--chalk); }
.note.warn { background: var(--gold-soft); color: var(--chalk); }

/* Empty / coming */
.empty { display: flex; flex-direction: column; gap: 14px; padding: 22px 0 4px; }
.empty-art { width: 100%; max-width: 100%; height: auto; color: var(--line-strong); }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { padding: 12px 0; border-bottom: 1px solid var(--line); }

/* Bottom nav */
.arb-fab { position: fixed; z-index: 24; right: max(16px, calc((100vw - 560px) / 2 + 16px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 14px; border: 0; border-radius: 999px; background: var(--green); color: var(--on-green); font: inherit; font-size: 15px; font-weight: 800; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55); cursor: pointer; }
.arb-fab:hover { background: var(--green-press); }
.arb-fab[hidden] { display: none; }
.arb-fab svg { width: 22px; height: 22px; flex: none; }
body.has-arb #app::after { content: ""; display: block; height: 64px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
  background: var(--pitch); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--nav-h); }
.tab { border: 0; background: none; color: var(--fg-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; letter-spacing: -0.02em; font-weight: 600; min-width: 0; padding: 0 2px; }
@media (min-width: 420px) { .tab { font-size: 11.5px; letter-spacing: 0; } }
.tab .pic, .tab .tile { width: 32px; height: 32px; border-radius: 9px; opacity: 0.5; filter: saturate(0.35); transition: opacity 160ms ease, filter 160ms ease; }
.tab .tile svg { width: 18px; height: 18px; }
.tab[aria-current="page"] { color: var(--green); }
.tab[aria-current="page"] .pic, .tab[aria-current="page"] .tile { opacity: 1; filter: none; }
.tab:hover .pic, .tab:hover .tile { opacity: 0.85; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--chalk); color: var(--pitch); padding: 12px 16px; border-radius: var(--r-s); font-weight: 600; font-size: 14px;
  z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.sync.on i { background: var(--green); }
.sync.off i { background: var(--gold); }
.splash { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.splash { min-height: calc(100vh - 48px); min-height: calc(100dvh - 48px); gap: 18px; width: 100%; border: 0; background: none; color: inherit; font: inherit; }
.splash .hero-crest { width: min(64vw, 300px); height: auto; }
.app:has(.splash) { background: none; }
.splash-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--pitch); }
.splash-bg video, .splash-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.splash-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 11, 9, 0.62), rgba(8, 11, 9, 0.5) 45%, rgba(8, 11, 9, 0.82)); }
.splash > :not(.splash-bg) { position: relative; z-index: 1; }
.splash-slogan { font-size: clamp(19px, 5.4vw, 26px); font-weight: 800; line-height: 1.3; margin: 0; text-wrap: balance; }
.splash-hello { font-size: 17px; font-weight: 600; color: var(--green); margin: 0; }
.ask-name { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; font-size: 14px; font-weight: 600; }
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--turf); color: var(--chalk); font: inherit; font-size: 16px; }
.splash .btn { margin-top: 18px; min-width: min(80vw, 320px); }
.login { max-width: 420px; margin: 0 auto; text-align: left; align-items: stretch; }
.login .login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.login form { display: flex; flex-direction: column; gap: 14px; width: 100%; }
.login-code { font-size: 24px; font-weight: 700; letter-spacing: 0.2em; text-align: center; font-variant-numeric: tabular-nums; }
.login .err { color: var(--red); font-size: 14px; margin: 0; }
.login .hint { margin: 0; font-size: 14px; color: var(--fg-2); }
.splash .brand-wm { height: clamp(72px, 20vw, 104px); width: auto; }
.owner-note { font-size: 14px; padding: 12px 14px; border-radius: var(--r-s); background: var(--turf); color: var(--fg-2); margin: 0; }

/* Home hero: the crest and what the app is for */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "crest actions" "crest title" "sub sub"; align-items: center; column-gap: 16px; row-gap: 6px; padding-block: 14px 4px; }
.hero-actions { grid-area: actions; justify-self: end; align-self: start; }
.hero-brand { grid-area: crest; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hero-crest { width: 72px; height: auto; display: block; filter: drop-shadow(0 6px 18px rgba(169, 224, 35, 0.25)); }
.hero-wm { width: 92px; height: auto; display: block; }

.hero-title { grid-area: title; }
.hero-more { grid-area: sub; }
.hero-title { font-size: 25px; font-weight: 900; font-style: italic; line-height: 1.1; letter-spacing: -0.01em; }
.hero-title em { font-style: italic; color: var(--green); }
.hero-sub { margin: 8px 0 0; font-size: 14.5px; color: var(--fg-2); max-width: 52ch; }
.hero-hello { margin: 8px 0 0; font-size: 13px; color: var(--fg-3); }
.side-card { display: flex; flex-direction: column; gap: 12px; }
.home > .match { order: 1; }
.home > .dom { order: 2; }
.home > .home-side { order: 3; }
.row.soon { cursor: default; opacity: 0.62; }
.row.soon .pic { filter: saturate(0.2); }
.skel { height: 16px; border-radius: 8px; background: var(--turf); }

/* Desktop: rail navigation, two-column home, reading column for quiz and sheets */
@media (min-width: 900px) {
  body { padding-left: 92px; }
  .tabbar { top: 0; right: auto; width: 92px; border-top: 0; border-right: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .tabbar-in { grid-template-columns: 1fr; grid-auto-rows: 84px; height: auto; padding-top: 72px; }
  .tab .pic, .tab .tile { width: 38px; height: 38px; border-radius: 10px; }
  .tab { font-size: 11.5px; letter-spacing: 0; }
  .app { max-width: 1080px; padding-block: 0 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
  .screen.home { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-areas: "hero hero" "match side" "dom side"; column-gap: 40px; row-gap: 28px; align-items: start; }
  .home > .hero { grid-area: hero; padding-block: 14px 8px; grid-template-areas: "crest actions" "crest title" "crest sub"; row-gap: 0; }
  .hero-title { align-self: end; }
  .hero-more { align-self: start; }
  .hero-crest { width: 120px; }
  .hero-wm { width: 150px; }
  .hero-title { font-size: 36px; }
  .hero-sub { font-size: 16px; }
  .home > .match { grid-area: match; }
  .home > .home-side { grid-area: side; }
  .home > .dom { grid-area: dom; }
  .screen.narrow, .quiz-top { max-width: 720px; }
  .toast { bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
.no-fx .var, .no-fx .pop { animation: none; }
</style>

          <p class="var-expl">${esc(q.explication)}</p>

          ${q.avant ? `<div class="before"><b>Avant le ${esc(frDate(addDays(q.avant.jusqu_au, 1)))}</b><p>${esc(q.avant.regle)}</p></div>` : ""}
          ${arbitreOn() ? `<button class="btn btn-ghost btn-block" data-act="arbitre" data-param="q:${q.id}:${order[s.picked]}">${icon("whistle")}Appeler l'arbitre</button>` : ""}
          <div class="var-foot"><span class="origin">${esc(q.origine)}${q.verifiee_le ? ` · vérifiée le ${esc(frDate(q.verifiee_le))}` : ""}</span>
            <button class="link-btn" data-act="report" data-param="${q.id}">${icon("flag")} Signaler une erreur</button></div>
        </div></section>`;
    }
    return `<div class="quiz-top">
        <div class="quiz-top-row"><button class="icon-btn" data-act="quit" aria-label="Quitter la séance">${icon("x")}</button>
          <span class="quiz-count">Question ${s.i + 1} / ${s.ids.length}</span><span class="quiz-chap">${esc(ch?.titre || "")}<br><span class="q-level">${q.niveau === 1 ? "Échauffement" : "Format examen"}</span></span></div>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement de la séance"><i style="width:${pct}%"></i></div>
      </div>
      <main class="screen narrow" style="gap:20px">
        <h1 class="q-text" id="q-t">${esc(q.enonce)}</h1>
        <div class="opts" role="group" aria-labelledby="q-t">${opts}</div>
        ${var_}
        ${s.confirmQuit ? `<div class="confirm" role="group" aria-labelledby="cq-t"><b id="cq-t">Quitter le match ?</b>
          <span class="small muted">${s.results.length > 1 ? `Tes ${s.results.length} réponses sont gardées` : "Ta réponse est gardée"} pour la révision, mais la séance ne compte pas comme jouée.</span>
          <div class="confirm-actions"><button class="btn btn-primary" data-act="stay">Continuer</button><button class="btn btn-ghost" data-act="quit-yes">Quitter</button></div></div>`
        : answered ? `<div class="quiz-next"><button class="btn btn-primary btn-block" data-act="next">${s.i + 1 < s.ids.length ? "Question suivante" : "Voir le score"}${icon("chevron")}</button></div>` : ""}
      </main>`;
  }

  function vResult() {
    const s = S.session; if (!s?.summary) return vHome();
    const { right, total, bonus, won, divisionUp } = s.summary;
    const missed = s.results.filter((r) => !r.right).map((r) => C.q(r.id)).filter(Boolean);
    const gainXp = s.results.reduce((n, r) => n + (r.right ? 10 : 2), 0) + bonus;
    const word = total && right === total ? "Sans faute." : right / Math.max(1, total) >= 0.7 ? "Belle victoire." : right / Math.max(1, total) >= 0.5 ? "Match serré." : "Défaite, mais tu as appris.";
    return `${header()}<main class="screen narrow">
      <div class="score">
        <span class="score-big num ${fxOn() ? "pop" : ""}">${right}<small> / ${total}</small></span>
        <h1 class="h-sec">${word}</h1><span class="muted small">${esc(s.label)}</span></div>
      <div class="gains"><span class="gain num">${icon("star")}+${gainXp} points</span><span class="gain num">${icon("flame")}${S.progress.streak.count} ${S.progress.streak.count > 1 ? "jours" : "jour"} de série</span></div>
      ${divisionUp ? `<div class="trophy-new ${fxOn() ? "pop" : ""}">${pic("ic-trophy")}<div><b>Montée en ${esc(divisionUp)}</b><span>Tu changes de division.</span></div></div>` : ""}
      ${won.map((id) => { const t = TROPHIES.find((x) => x.id === id); return t ? `<div class="trophy-new ${fxOn() ? "pop" : ""}">${pic("ic-trophy")}<div><b>Trophée : ${esc(t.name)}</b><span>${esc(t.desc)}</span></div></div>` : ""; }).join("")}
      ${missed.length ? `<section class="sec" aria-labelledby="miss-t"><h2 class="h-sec" id="miss-t">À revoir demain</h2>
        <div class="rows">${missed.map((q) => `<button class="row" data-go="chapter" data-param="${q.chapitre}"><span class="stack"><span class="row-title">${q.article ? `${esc(q.article.texte)}, ${esc(q.article.ref)}` : esc(C.chapter(q.chapitre)?.titre || "")}</span><span class="row-sub">${esc(q.enonce)}</span></span><span class="row-side">${icon("chevron")}</span></button>`).join("")}</div>
        <p class="tiny">Ces questions reviendront dans ta séance de demain, puis à 3, 7, 14 et 30 jours une fois réussies.</p></section>` : ""}
      <div class="stack" style="gap:10px"><button class="btn btn-primary btn-block" data-go="home">Retour à l'accueil</button>
        <button class="btn btn-ghost btn-block" data-go="train">Voir les chapitres</button></div>
    </main>`;
  }

  /* ---------- Match: today, one module, or the mock exam ---------- */
  function vMatch() {
    return `${header()}<main class="screen">
      <div class="greet"><h1 class="h-screen">Match</h1><p class="muted small">Joue le match du jour, ou choisis un module à travailler.</p></div>
      ${matchCard()}
      <section class="sec" aria-labelledby="mm-t"><h2 class="h-sec" id="mm-t">Match par module</h2>
        <div class="rows">${C.domains().filter((d) => C.qOfDomain(d.id).length).map((d) => {
          const qs = C.qOfDomain(d.id); const m = mastery(qs);
          return `<button class="row has-pic" data-act="module-match" data-param="${d.id}">${domPic(d.id)}
            <span class="stack"><span class="row-title">${esc(d.titre)}</span><span class="row-sub">${qs.length} questions</span></span>
            <span class="row-side num">${m} %${icon("play")}</span>
            <span class="bar" aria-hidden="true"><i style="width:${m}%"></i></span></button>`;
        }).join("")}</div></section>
      ${officialBlock()}
    </main>`;
  }

  /* ---------- Match officiel: a past paper, timed, marked out of 20 ---------- */
  const EX_MIN = 10; /* below this mark the candidate cannot sit the FFF paper */
  const examById = (id) => (S.content?.examens || []).find((e) => e.id === id);
  const examNow = () => S.progress.examCur || null;
  const frNote = (n) => String(Math.round(n * 100) / 100).replace(".", ",");
  function officialBlock() {
    const cur = examNow(), res = S.progress.examResults || [];
    return `<section class="sec" aria-labelledby="ex-t"><h2 class="h-sec" id="ex-t">Match officiel</h2>
      <p class="muted small" style="margin:0">Un vrai sujet du CNOSF, noté sur 20, en 2 heures et sans document.</p>
      <div class="rows">${(S.content?.examens || []).map((e) => {
        const last = res.find((r) => r.id === e.id), mine = cur && cur.id === e.id;
        return `<button class="row" data-act="${mine ? "exam-resume" : "exam-intro"}" data-param="${e.id}"><span class="stack"><span class="row-title">${esc(e.titre)}</span><span class="row-sub num">${mine ? (cur.phase === "fix" ? "Correction en cours" : "Match en cours") : last ? `Dernière note : ${frNote(last.note)} / 20` : "18 QCM et 2 cas pratiques"}</span></span><span class="row-side">${icon(mine ? "play" : "chevron")}</span></button>`;
      }).join("")}</div>
</section>`;
  }
  function vExamIntro() {
    const e = examById(S.param); if (!e) return vMatch();
    return `<main class="screen narrow">
      <div class="stack" style="gap:6px"><button class="link-btn" data-go="match" style="align-self:flex-start">${icon("back")} Match</button>
        <h1 class="h-screen">${esc(e.titre)}</h1><p class="muted small">Comme le jour de l'épreuve générale du CNOSF.</p></div>
      <section class="sheet dark"><ul class="plan" style="margin:0">
        <li><span><b>2 heures, sans document</b><br><span class="muted small">Le chrono démarre dès que tu commences et continue si tu quittes l'appli.</span></span></li>
        <li><span><b>18 QCM, 9 points</b><br><span class="muted small">0,5 point par question, une seule bonne réponse.</span></span></li>
        <li><span><b>2 cas pratiques, ${e.cas.map((c) => c.points).join(" et ")} points</b><br><span class="muted small">Tu rédiges, puis tu notes toi-même ta réponse avec le corrigé.${e.cas.some((c) => c.questions.some((x) => !x.pts)) ? " Barème indicatif : le même nombre de points par question, quand le sujet ne le précise pas." : ""}</span></span></li>
        <li><span><b>10/20 minimum</b><br><span class="muted small">En dessous, la note est éliminatoire pour l'épreuve FFF.</span></span></li>
      </ul></section>
      ${e.note ? `<p class="note warn">${esc(e.note)}</p>` : ""}
      <div class="lesson-end"><button class="btn btn-primary btn-block" data-act="exam-start" data-param="${e.id}">${icon("play")}Commencer le match</button></div>
    </main>`;
  }
  const examLeft = (cur, e) => Math.max(0, Math.round((cur.start + e.minutes * 60000 - Date.now()) / 1000));
  const clock = (sec) => `${Math.floor(sec / 3600)} h ${String(Math.floor(sec / 60) % 60).padStart(2, "0")} min ${String(sec % 60).padStart(2, "0")}`;
  const examCount = (cur, e) => e.qcm.filter((id) => cur.qcm[id] !== undefined).length;
  const isBlank = (cur, key) => !(cur.cas[key] || "").trim();
  const examBlank = (cur, e) => e.cas.reduce((n, c, i) => n + c.questions.filter((_, j) => isBlank(cur, `${i}-${j}`)).length, 0);
  function examMissing(cur, e) {
    const q = e.qcm.length - examCount(cur, e), w = examBlank(cur, e), parts = [];
    if (q) parts.push(`${q} QCM sans réponse`);
    if (w) parts.push(`${w} réponse${w > 1 ? "s" : ""} rédigée${w > 1 ? "s" : ""} vide${w > 1 ? "s" : ""}`);
    return parts.length ? `Il te reste ${parts.join(" et ")}. ` : "";
  }
  function vExam() {
    const cur = examNow(), e = cur && examById(cur.id); if (!e) return vMatch();
    return `<main class="screen narrow exam">
      <div class="exam-bar"><button class="link-btn" data-go="match" aria-label="Quitter : le chrono continue">Quitter</button><span class="exam-time num${examLeft(cur, e) <= 300 ? " is-low" : ""}" id="ex-time" role="timer">${clock(examLeft(cur, e))}</span><span class="tiny num" id="ex-count">${examCount(cur, e)} / ${e.qcm.length} QCM</span></div>
      <h1 class="h-screen">${esc(e.titre)}</h1>
      <section class="sec" aria-labelledby="p1-t"><h2 class="h-sec" id="p1-t">Les 18 QCM</h2>
        ${e.qcm.map((id, n) => { const q = C.q(id); return q ? `<div class="exam-q"><p class="q-text" id="qq-${n}"><span class="num">${n + 1}.</span> ${esc(q.enonce)}</p>
          <div class="opts" role="group" aria-labelledby="qq-${n}">${q.options.map((o, k) => `<button class="opt${cur.qcm[id] === k ? " is-picked" : ""}" data-act="exam-pick" data-param="${id}:${k}" aria-pressed="${cur.qcm[id] === k}"><span class="opt-letter">${LETTERS[k]}</span><span>${esc(o)}</span><span class="opt-mark"></span></button>`).join("")}</div></div>` : ""; }).join("")}
      </section>
      ${e.cas.map((cas, i) => `<section class="sec" aria-labelledby="c${i}-t"><h2 class="h-sec" id="c${i}-t">${esc(cas.titre)}, ${cas.points} points</h2>
        <p class="exam-case">${esc(cas.enonce)}</p>
        ${cas.questions.map((x, j) => `<div class="field"><label for="ca-${i}-${j}">${j + 1}. ${esc(x.q)}</label><textarea id="ca-${i}-${j}" class="exam-text" data-cas="${i}-${j}" rows="4">${esc(cur.cas[`${i}-${j}`] || "")}</textarea></div>`).join("")}
      </section>`).join("")}
      ${cur.confirm === "drop"
        ? `<div class="ed-confirm" role="alert"><p>Abandonner ce match ? Tes réponses seront perdues et il n'y aura pas de note.</p><button class="btn btn-ghost btn-block" data-act="exam-stay">Continuer le match</button><button class="btn btn-ghost btn-block" data-act="exam-drop-yes">Abandonner le match</button></div>`
        : cur.confirm
          ? `<div class="ed-confirm" role="alert"><p>Rendre ta copie ? ${examMissing(cur, e)}Tu ne pourras plus modifier tes réponses.</p><button class="btn btn-ghost btn-block" data-act="exam-stay">Continuer le match</button><button class="btn btn-primary btn-block" data-act="exam-submit">Rendre ma copie</button></div>`
          : `<div class="lesson-end"><button class="btn btn-primary btn-block" data-act="exam-ask">${icon("check")}Rendre ma copie</button>
          <button class="link-btn" data-act="exam-drop" style="align-self:center">Abandonner ce match</button></div>`}
    </main>`;
  }
  function examMark(cur, e) {
    const right = e.qcm.filter((id) => cur.qcm[id] === C.q(id)?.bonne).length;
    let cas = 0, todo = 0, open = 0;
    e.cas.forEach((c, i) => c.questions.forEach((_, j) => {
      const key = `${i}-${j}`, worth = c.questions[j].pts || c.points / c.questions.length, g = cur.grade[key];
      if (isBlank(cur, key)) return; /* no answer, no point */
      if (g === undefined) { todo++; open += worth; } else cas += g * worth;
    }));
    return { right, qcm: right * 0.5, cas, todo, open, note: right * 0.5 + cas };
  }
  function vExamFix() {
    const cur = examNow(), e = cur && examById(cur.id); if (!e) return vMatch();
    const m = examMark(cur, e);
    return `<main class="screen narrow">
      <div class="stack" style="gap:6px"><button class="link-btn" data-go="match" style="align-self:flex-start">${icon("back")} Match</button><h1 class="h-screen">Correction</h1><p class="muted small">${esc(e.titre)}${cur.late ? " · copie rendue à la fin du temps" : ""}</p></div>
      <div class="exam-score"><span class="score-big num">${frNote(m.note)}<small> / 20</small></span>
        <p class="small" style="margin:0">QCM : ${m.right} sur ${e.qcm.length}, soit ${frNote(m.qcm)} points. Cas pratiques : ${frNote(m.cas)} point${m.cas > 1 ? "s" : ""}.</p>
        ${m.todo ? `<p class="small" style="margin:0"><b>Note provisoire :</b> il reste ${m.todo} réponse${m.todo > 1 ? "s" : ""} à noter, jusqu'à ${frNote(m.open)} point${m.open > 1 ? "s" : ""} de plus.</p>` : ""}
        ${m.todo ? "" : `<p class="note ${m.note >= EX_MIN ? "ok" : "warn"}">${m.note >= EX_MIN ? "Au-dessus des 10/20 demandés pour passer à l'épreuve FFF." : "Sous les 10/20 : cette note serait éliminatoire pour l'épreuve FFF."}</p>`}</div>
      ${e.cas.map((cas, i) => `<section class="sec" aria-labelledby="fc${i}-t"><h2 class="h-sec" id="fc${i}-t">${esc(cas.titre)}</h2><p class="muted small" style="margin:0">Compare ta réponse au corrigé, puis note-toi.</p>
        ${cas.questions.map((x, j) => { const key = `${i}-${j}`, g = cur.grade[key]; return `<div class="exam-fix"><p class="exam-fq">${j + 1}. ${esc(x.q)}</p>
          <p class="small muted exam-yours" style="margin:0">Ta réponse : ${isBlank(cur, key) ? "aucune" : esc(cur.cas[key])}</p>
          <p class="exam-corr"><b>Corrigé :</b> ${esc(x.c)} <span class="muted small">(${esc(x.ref)})</span></p>
          ${isBlank(cur, key) ? `<p class="small" style="margin:0"><b>Sans réponse : 0 point.</b></p>` : `<div class="seg" role="group" aria-label="Ta note pour cette réponse">${[[1, "Trouvé"], [0.5, "En partie"], [0, "Manqué"]].map(([v, l]) => `<button data-act="exam-grade" data-param="${key}:${v}" aria-pressed="${g === v}">${l}</button>`).join("")}</div>`}</div>`; }).join("")}</section>`).join("")}
      <button class="btn btn-primary btn-block" data-act="exam-save">${icon("check")}${m.todo ? `Enregistrer ma note (${m.todo} à noter)` : "Enregistrer ma note"}</button>
      <section class="sec" aria-labelledby="fq-t"><h2 class="h-sec" id="fq-t">Les QCM</h2>
        ${e.qcm.map((id, n) => { const q = C.q(id); if (!q) return ""; const c = cur.qcm[id], ok = c === q.bonne; return `<div class="exam-fix"><p class="exam-fq"><span class="exam-mark ${ok ? "ok" : "ko"}">${icon(ok ? "check" : "close")}<span class="sr">${ok ? "Juste." : "Faux."}</span></span>${n + 1}. ${esc(q.enonce)}</p>
          ${ok ? "" : `<p class="small muted" style="margin:0">Ta réponse : ${c === undefined ? "aucune" : esc(q.options[c])}</p>`}
          <p class="exam-corr"><b>Bonne réponse :</b> ${esc(q.options[q.bonne])}</p><p class="small muted" style="margin:0">${esc(q.explication)}</p></div>`; }).join("")}</section>
      <div class="lesson-end"><button class="btn btn-primary btn-block" data-act="exam-save">${icon("check")}${m.todo ? `Enregistrer ma note (${m.todo} à noter)` : "Enregistrer ma note"}</button></div>
    </main>`;
  }
  function examSubmit(late) {
    const cur = examNow(), e = cur && examById(cur.id); if (!e || cur.phase === "fix") return;
    e.qcm.forEach((id) => { const q = C.q(id); if (q && cur.qcm[id] !== undefined) grade(q, cur.qcm[id]); }); /* wrong answers come back in the daily match */
    cur.phase = "fix"; cur.confirm = false; cur.late = !!late;
    save(); go("examFix");
    if (late) toast("Temps écoulé : ta copie est rendue.");
  }
  // One tick a second while the exam is on screen, or to close a paper whose time ran out
  setInterval(() => {
    if (S.view !== "exam" || !S.progress) return;
    const cur = examNow(), e = cur && examById(cur.id); if (!e || cur.phase === "fix") return;
    const left = examLeft(cur, e);
    const n = document.getElementById("ex-time"); if (n) { n.textContent = clock(left); n.classList.toggle("is-low", left <= 300); }
    const step = [60, 300, 1800].find((t) => left <= t && left > 0);
    if (step && (cur.warned === undefined || step < cur.warned)) {
      cur.warned = step;
      const msg = `Il reste ${step / 60} minute${step > 60 ? "s" : ""}.`;
      toast(msg); announce(msg);
    }
    if (!left) examSubmit(true);
  }, 1000);

  /* ---------- Cartes: one notion per card, a collection per module ---------- */
  const allCards = () => S.content?.cartes || [];
  const cardState = (id) => S.progress.cards?.[id];
  const cardsKnown = (list) => list.filter((k) => cardState(k.id)?.s === "ok").length;
  const CARD_KINDS = [["all", "Tout"], ["terme", "Termes"], ["article", "Articles"]];
  function buildDeck(pool, n) {
    const rank = (k) => { const st = cardState(k.id); return !st ? 1 : st.s === "todo" ? 0 : 2; };
    const when = (k) => cardState(k.id)?.d || "";
    return pool.slice().sort((a, b) => rank(a) - rank(b) || when(a).localeCompare(when(b))).slice(0, n).map((k) => k.id);
  }
  function startDeck(ids, single, mod) {
    if (!ids.length) { toast("Aucune carte disponible pour l'instant."); return; }
    S.deck = { ids, i: 0, flip: !!single, ok: 0, todo: 0, single: !!single, mod: mod || null, back: S.deck?.back || (S.view === "train" ? "train" : "cards") };
    go("cardPlay");
  }
  function cardResults() {
    const q = normS(S.cardQ.q).trim(), terms = q.split(" ").filter(Boolean);
    const hits = allCards().filter((k) => (S.cardQ.kind === "all" || k.genre === S.cardQ.kind) && (terms.length ? terms.every((t) => normS(k.recto + " " + k.verso).includes(t)) : true));
    if (!hits.length) return `<p class="rev-count" role="status">Aucune carte trouvée. Essaie un autre mot, ou cherche dans Programme, qui couvre aussi les cours.</p>`;
    const rx = terms.length ? new RegExp(terms.map(termRx).join("|"), "gi") : null;
    const mark = (t) => rx ? markText(t, rx) : esc(t);
    const sorted = terms.length ? hits : hits.slice().sort((a, b) => a.recto.localeCompare(b.recto, "fr"));
    return `<p class="rev-count" role="status">${hits.length} carte${hits.length > 1 ? "s" : ""}${hits.length > 40 ? ", les 40 premières affichées" : ""}</p><div class="rows">${sorted.slice(0, 40).map((k) => {
      const d = C.domain(k.domaine);
      return `<button class="row" data-act="card-open" data-param="${k.id}"><span class="stack"><span class="row-title" style="font-size:15px">${mark(k.recto)}</span><span class="row-sub">${d?.num ? "Module " + d.num + " · " : ""}${mark(k.verso.length > 110 ? k.verso.slice(0, 110) + " …" : k.verso)}</span></span><span class="row-side">${icon("chevron")}</span></button>`;
    }).join("")}</div>`;
  }
  function cardCollection() {
    const doms = C.domains();
    const without = doms.filter((d) => !allCards().some((k) => k.domaine === d.id));
    return `<section class="sec" aria-labelledby="col-t"><h2 class="h-sec" id="col-t">Ta collection</h2>
      <div class="rows">${doms.filter((d) => !without.includes(d)).map((d) => {
        const list = allCards().filter((k) => k.domaine === d.id), n = cardsKnown(list), pct = Math.round(100 * n / list.length);
        return `<button class="row has-pic" data-act="card-module" data-param="${d.id}">${domPic(d.id)}
          <span class="stack"><span class="row-title">${esc(d.titre)}</span><span class="row-sub num">${n} sur ${list.length} cartes</span></span>
          <span class="row-side">${icon("play")}</span>
          <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
      }).join("")}</div>
      ${without.length ? `<p class="note">Pas encore de cartes pour : ${without.map((d) => esc(d.num ? "Module " + d.num : d.titre)).join(", ")}.</p>` : ""}</section>`;
  }
  const cardOut = () => normS(S.cardQ.q).trim().length >= 2 || S.cardQ.kind !== "all" ? cardResults() : cardCollection();
  function vCards() {
    S.cardQ = S.cardQ || { q: "", kind: "all" };
    const all = allCards(), n = cardsKnown(all), pct = all.length ? Math.round(100 * n / all.length) : 0;
    return `${header()}<main class="screen">
      <div class="greet"><h1 class="h-screen">Cartes</h1><p class="muted small">Une notion par carte. Retourne-la, puis dis si tu la connais.</p></div>
      <section class="ladder" aria-label="Cartes acquises">
        <div class="ladder-row"><span class="cards-count num">${n} sur ${all.length} cartes acquises</span></div>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Cartes acquises"><i style="width:${pct}%"></i></div>

  /* ---------- Révisions: search over everything, then one page per module ---------- */
  const normS = (t) => String(t || "").toLowerCase().replace(/œ/g, "oe").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").replace(/\b([lrda])\.? ?(\d)/g, "$1$2");

  /* ---------- Fiche editor (web version, editors only) ---------- */
  const RICH = { H1: "h3", H2: "h3", H3: "h3", H4: "h4", H5: "h4", H6: "h4", P: "p", DIV: "p", UL: "ul", OL: "ol", LI: "li", STRONG: "strong", B: "strong", EM: "em", I: "em", MARK: "mark", BR: "br", BLOCKQUOTE: "blockquote", TABLE: "table", THEAD: "thead", TBODY: "tbody", TR: "tr", TH: "th", TD: "td" };
  const CALLOUT_CLS = /^callout (cas|warn|memo)$/, CALLOUT_P = /^callout-(lab|sub)$/;
  // Allow-list: only these tags, and no attribute except the class of a course callout. Applied on save and on every display.
  function cleanRich(html, keepH2) {
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    const out = doc.createElement("div");
    const walk = (from, to) => from.childNodes.forEach((n) => {
      if (n.nodeType === 3) { to.append(n.textContent); return; }
      if (n.nodeType !== 1 || /^(script|style|iframe|object|embed|noscript|template|svg|math)$/i.test(n.nodeName)) return;

      if (!para) { para = doc.createElement("p"); n.before(para); }
      para.append(n);
    });
    return out.innerHTML;
  }

  const arbParam = () => ["fiche", "cours", "chapter"].includes(S.view) && S.param ? `c:${S.param}` : "g";
  const ARB_ERR = {

  function arbSuggestions() {
    if (S.arb.ctx.q) return ["Explique-moi ça plus simplement", "Donne-moi un exemple dans le football", "Pourquoi les autres réponses sont fausses ?"];
    if (S.arb.ctx.chapitre) return ["Explique-moi ce chapitre simplement", "Quels pièges éviter à l'examen ?"];
    return ["Quelle est la différence entre agrément et délégation ?", "Que fait un agent sportif, concrètement ?"];

  function arbLog() {
    const A = S.arb;
    const turns = A.msgs.map((m) => m.role === "user"
      ? `<p class="arb-me">${esc(m.text)}</p>`
      : `<div><div class="arb-ans">${m.text.split(/\n\s*\n/).map((x) => `<p>${esc(x.trim())}</p>`).join("")}</div>${m.sources?.length ? `<p class="arb-src">D'après : ${m.sources.map(esc).join(" · ")}</p>` : ""}</div>`).join("");
    return `${A.msgs.length ? "" : `<p class="arb-intro">Pose ta question : je réponds à partir de tes cours, de tes fiches et des articles de l'appli.</p>

  function arbPaint() {
    const log = document.querySelector("#arb-dlg .arb-log"); if (!log) return;

  }
  function openArbitre(param) {
    const [kind, id, pick] = String(param).split(":");
    const key = String(param);
    if (S.arb?.key !== key) S.arb = { key, ctx: kind === "q" ? { q: id, pick: Number(pick) } : kind === "c" ? { chapitre: id } : {}, msgs: [], busy: false, err: "", left: S.arb?.left ?? null };
    let d = document.getElementById("arb-dlg");
    if (!d) {
      d = document.createElement("dialog"); d.id = "arb-dlg"; d.className = "art-dlg"; d.setAttribute("aria-labelledby", "arb-t"); document.body.append(d);

  async function arbAsk(text) {
    const A = S.arb, q = String(text || "").trim(); if (!A || A.busy) return;
    if (!q) { A.err = "Écris d'abord ta question."; arbPaint(); return; }
    const history = A.msgs.map((m) => ({ role: m.role, text: m.text }));
    A.msgs.push({ role: "user", text: q }); A.busy = true; A.err = ""; arbPaint();
    let code = null, data = null;
    try {
      const r = await S.sb.functions.invoke(CFG.arbitreFn || "arbitre", { body: { question: q, ctx: A.ctx, history } });
      if (r.error) { const j = await r.error.context?.json?.().catch(() => null); code = j?.code || "other"; }
      else data = r.data;
    } catch (x) { code = "other"; }
    A.busy = false;
    if (data?.reponse) {
      A.msgs.push({ role: "assistant", text: data.reponse, sources: data.sources || [] });
      if (Number.isInteger(data.restantes)) A.left = data.restantes;
    } else {
      A.msgs.pop(); A.err = ARB_ERR[code] || ARB_ERR.other;

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-go],[data-act]"); if (!el) return;
    const param = el.dataset.param ?? null;
    if (el.dataset.go) {
      if (el.dataset.from) S.from = el.dataset.from;
      if (el.dataset.go === "fiche" && param && !isRead("f:" + param)) { S.progress.read = Object.assign({}, S.progress.read, { ["f:" + param]: today() }); save(); }
      else if (el.classList.contains("tab") || ["train", "home"].includes(el.dataset.go)) S.from = null;
      go(el.dataset.go, param);
      if (el.dataset.anchor) document.getElementById(el.dataset.anchor)?.scrollIntoView({ block: "start" });
      return;
    }
    const s = S.session;
    switch (el.dataset.act) {
      case "daily": { const p = buildDaily(S.progress.settings.perSession); startSession("daily", p.ids, "Match du jour"); break; }
      case "enter": S.welcome = false; if (S.content && !S.progress.settings.tourDone) { S.tour = 0; S.tourBack = false; go("tour"); } else go("home"); break;
      case "tour-open": S.tour = 0; S.tourBack = true; go("tour"); break;
      case "tour-next": S.tour = (S.tour || 0) + 1; go("tour"); break;
      case "tour-prev": S.tour = Math.max(0, (S.tour || 0) - 1); go("tour"); break;
      case "tour-skip": { const back = S.tourBack ? "me" : "home"; tourDone(); S.tourBack = false; go(back); break; }
      case "tour-first": { tourDone(); S.tourBack = false; const plan = buildDaily(S.progress.settings.perSession); startSession("daily", plan.ids, "Match du jour"); break; }
      case "rev-kind": S.rev.kind = param; document.querySelectorAll("#rev-chips .chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.param === param)); document.getElementById("rev-out").innerHTML = typo(normS(S.rev.q).trim().length >= 2 ? revResults() : revDefault()); break;
      case "ask": { const q = C.q(param); if (q) startSession("chapter", [q.id], "Question : " + q.enonce.slice(0, 40)); break; }
      case "toc": { const t = document.getElementById(param); if (t) { t.scrollIntoView({ behavior: fxOn() ? "smooth" : "auto", block: "start" }); t.querySelector("h2")?.setAttribute("tabindex", "-1"); t.querySelector("h2")?.focus({ preventScroll: true }); } break; }
      case "read-done": {
        const first = !isRead(param);
        S.progress.read = Object.assign({}, S.progress.read, { [param]: today(), ["f:" + param]: today() });
        if (first) { S.progress.xp += 20; save(); toast("Cours lu : +20 points"); } else save();
        go("fiche", param); break;
      }
      case "chapter": { const c = C.chapter(param); startSession("chapter", C.qOf(param).map((q) => q.id), "Chapitre : " + (c?.titre || "")); break; }
      case "pick": {
        if (!s || s.picked !== null) return;
        const q = C.q(s.ids[s.i]); const order = (s.orders && s.orders[q.id]) || q.options.map((_, k) => k);
        s.picked = Number(param); const right = grade(q, order[s.picked]); keepSession(); render();
        announce(right ? "But validé, bonne réponse." : `But refusé. La bonne réponse était ${LETTERS[order.indexOf(q.bonne)]}.`);
        requestAnimationFrame(() => {
          document.getElementById("var")?.scrollIntoView({ behavior: fxOn() ? "smooth" : "auto", block: "nearest" });
          document.getElementById("var-t")?.focus({ preventScroll: true });
        });
        if (navigator.vibrate && fxOn()) { try { navigator.vibrate(right ? 12 : [20, 40, 20]); } catch { /* unsupported */ } }
        break;
      }
      case "next": {
        if (!s) return;
        if (s.summary) { go("result"); break; }

        break;
      }
      case "stay": if (s) { s.confirmQuit = false; render(); } break;
      case "quit-yes": S.session = null; keepSession(); toast("Match quitté. Tes réponses sont gardées."); go("home"); break;
      case "resume": if (S.pending) { S.session = S.pending; S.session.confirmQuit = false; S.pending = null; go("quiz"); } break;
      case "report": go("me", param); requestAnimationFrame(() => document.getElementById("r-msg")?.focus()); break;
      case "per": S.progress.settings.perSession = Number(param); save(); render(); break;
      case "reload": location.reload(); break;
      case "login-back": if (S.login) { S.login.step = "email"; S.login.err = ""; render(); } break;
      case "module-match": { const d = C.domain(param); startSession("module", buildDaily(S.progress.settings.perSession, C.qOfDomain(param)).ids, "Match : " + (d?.titre || "")); break; }
      case "exam-intro": go("examIntro", param); break;

      case "exam-save": { const cur = examNow(), e = cur && examById(cur.id); if (!e) break; const m = examMark(cur, e);
        S.progress.examResults = [{ id: cur.id, date: today(), note: m.note, qcm: m.qcm, cas: m.cas }].concat(S.progress.examResults || []).slice(0, 30);
        S.progress.examCur = null; save(); go("match"); toast(`Note enregistrée : ${frNote(m.note)} / 20.`); break; }
      case "card-play": { const mod = S.deck?.mod; startDeck(buildDeck(mod ? allCards().filter((k) => k.domaine === mod) : allCards(), 10), false, mod); break; }
      case "card-module": startDeck(buildDeck(allCards().filter((k) => k.domaine === param), 10), false, param); break;
